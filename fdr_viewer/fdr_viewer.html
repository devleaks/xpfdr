const KEYVALUEREGEX = /(\w+)=('.*?'|".*?"|\s*\w+\(.*?\)|[^,=\s\)]+)/g;
const INDICESREGEX = /_indices[ \t]*=[ \t]*\[[ \t]*\d+(?:[ \t]*,[ \t]*\d+)+[ \t]*\]/g;
function nameValue(s) {
    let params = {};
    let match;
    while ((match = KEYVALUEREGEX.exec(s)) !== null) {
        const key = match[1];
        let value = match[2].replace(/,$/, "");
        value = value.replace(/['"]$/, "");
        value = value.replace(/^['"]/, "");
        params[key] = value == "None" ? null : value;
    }
    // extract indices, highly specific! not generic at all
    // search specifically for "_indices=[1, 2, 3]" string portion, then parse it
    if ((match = INDICESREGEX.exec(s)) !== null) {
        const INDICESREGEX2 = /\[[ \t]*\d+(?:[ \t]*,[ \t]*\d+)+[ \t]*\]/g;
        let m2;
        if ((m2 = INDICESREGEX2.exec(s)) != null) {
            let ms = m2[0];
            let arr = ms.replace("[", "").replace("]", "").replaceAll(" ", "").split(",")
            for(let i=0; i<arr.length; i++) {
                arr[i] = parseInt(arr[i]);
            }
            params["_indices"] = arr;
            // console.log("_indices", match, m2, arr);
        }
    }
    return params;    
}

// parse input file into geojson feature
function parseCSVFile(text) {
    let geojson = {}
    const lines = text.split("\n");
    let columns = lines[0].toLowerCase().split(","); // assumes first line is column header
    const lat_idx = columns.indexOf(CSV_COLUMN_NAMES.latitude);
    const lon_idx = columns.indexOf(CSV_COLUMN_NAMES.longitude);
    const ts_idx = columns.indexOf(CSV_COLUMN_NAMES.timestamp);
    if (ts_idx == -1 || lat_idx == -1 || lon_idx == -1) {
        error("No time, latitude and longitude in file");
        return {};
    }
    console.log(columns);
    const alt_idx = CSV_COLUMN_NAMES.altitude ? columns.indexOf(CSV_COLUMN_NAMES.altitude) : -1;
    const gs_idx = CSV_COLUMN_NAMES.ground_speed ? columns.indexOf(CSV_COLUMN_NAMES.ground_speed) : -1;
    console.log("indices", ts_idx, lat_idx, lon_idx, alt_idx, gs_idx);
    let i = 1;
    let count = 0;
    let fc = []
    columns = lines[0].toLowerCase().split(","); // assumes first line is column header
    while(i < lines.length) {
        let line = lines[i].trim();
        if (line == "") {
            i++;
            continue;
        }
        const values = line.split(",");
        if (values.length != columns.length) {
            console.warn("columns/values: non matching length", i, columns.length, values.length);
            continue;
        }
        let coords = [parseFloat(values[lon_idx]), parseFloat(values[lat_idx])]
        if (alt_idx > -1) {
            coords.push(parseFloat(values[alt_idx]))
        }
        let ts = parseFloat(values[ts_idx])
        let d = new Date(ts);
        let props = {
            "UTC Time": d.toISOString(),
            "_raw_ts": d.getTime(), // == ts
        }
        if (alt_idx != -1) {
            props[ALTITUDE_DATA] = values[alt_idx];
        }
        if (gs_idx != -1) {
            props[SPEED_DATA] = values[gs_idx];
        }
        for(j=1; j < values.length; j++) {
            props[j < columns.length ? columns[j] : "prop" + j] = isNaN(values[j]) ? values[j] : parseFloat(values[j]);
        }
        let p = {
            type: "Feature",
            geometry: {
                type: "Point",
                coordinates: coords
            },
            "properties": props
        }
        fc.push(p);
        i++;
    }
    geojson = {
        type: "FeatureCollection",
        features: fc
    }
    return geojson;
}

function parseFDRFile(text) {
    // \r CR 0x0D (13 decimal), \l LF 0x0A (10 decimal).
    let arch = String.fromCharCode(text.charCodeAt(0))
    if (["A", "I"].indexOf(arch) == -1) {
        error("invalid X-Plane FDR file architecture", arch);
        return {};
    }
    console.log("FDR file architecture", arch);

    let cr = text.charCodeAt(1)
    if (cr != 13) {
        console.warn("end of first line should be CR (decimal 13); got", cr);
    }
    let nl = text.charCodeAt(2)
    if (nl == 10) { // ok...
        console.warn("got extra LF (decimal 10)", nl);
        nl = text.charCodeAt(3)
    }
    if (nl != 51 && nl != 52) {  // "3" and "4"
        error("invalid X-Plane FDR file version", String.fromCharCode(nl), nl);
        return {};
    }
    let fdr_version = nl - 48;
    if ([3, 4].indexOf(fdr_version) == -1) {
        error("invalid X-Plane FDR file version", fdr_version);
        return {};
    }
    console.log("FDR data format version", fdr_version);

    let lines = text.split(arch == "A" ? "\n" : "\r");
    console.log("records", lines.length);

    let i = 2;
    let date = new Date();
    let data = Array();
    let navaids = Array();
    let commands = Array();
    let columns = Array();
    let fc = Array();
    let count = 0;
    while(i < lines.length) {
        if (lines[i].trim() == "") {
            i++;
            continue;
        }
        let line = lines[i].replace(/(\r\n|\n|\r)/gm, "").trim().split(",");
        if (HEADER_KEYWORDS.indexOf(line[0].trim()) > -1) {
            if (line[0].trim() == "DATE") {
                let a = line.slice(1).join(",").split("/");
                date = new Date(a[2], a[0]-1, a[1]);
                console.log(date);
            }
            // console.log(lines[i]);
            i++;
            continue;
        }
        if (DATA_KEYWORDS.indexOf(line[0].trim()) > -1) {
            if (line[0].trim() == "COMM") {
                let a = line.slice(1).join(",").trim();
                if (a.startsWith("FDRData(")) {
                    let params = nameValue(a)
                    let d = new FDRData(
                        params["name"],
                        params["dataref"],
                        params["pyslice"],
                        params["_indices"],
                        params["callback"],
                        params["unit"],
                        params["factor"],
                        params["chart"]
                    );
                    fdr_data.push(d);
                    // console.log(d);
                } else if (a.startsWith("NavAid(")) {
                    let params = nameValue(a)
                    let d = {
                        type: "Feature",
                        geometry: {
                            type: "Point",
                            coordinates: [parseFloat(params["lon"]), parseFloat(params["lat"])]
                        },
                        "properties": {
                            name: params["name"].replaceAll('"', ""),
                            navType: params["navType"],
                            navAidId: params["navAidId"],
                            height: parseFloat(params["height"]).toFixed(1),
                            heading: parseFloat(params["heading"]),
                            frequency: parseFloat(params["frequency"]) > 8000 ?
                                            parseFloat(params["frequency"])/100 : parseFloat(params["frequency"]),
                            reg: parseFloat(params["reg"])
                        }
                    };
                    navaids.push(d)
                    // console.log(d)
                } else if (a.startsWith("Command(")) {
                    let params = nameValue(a)
                    let d = {
                        type: "Feature",
                        geometry: {
                            type: "Point",
                            coordinates: [0.0, 0.0]  // geometry: chartData[FEATURES][params["index"]]["geometry"],
                        },
                        "properties": {
                            command: params["name"],
                            "UTC Time": params["when"],
                            index: parseInt(params["index"]),
                            phase: parseInt(params["phase"]),
                            before: parseInt(params["before"]),
                            category: params["category"]
                        }
                    };
                    commands.push(d)
                    // console.log(d)
                } else if (a.startsWith("UTC")) {
                    columns = a.split(",");
                    for(j=0;j<columns.length;j++) {
                        columns[j] = columns[j].trim();
                    }
                    console.log(columns);
                }
            }
            // console.log(lines[i]);
            i++;
            continue;
        }
        // raw
        if (line[0] == "DATA") {
            line = line.slice(1)
        }
        data.push(line);
        // GeoJSON Feature
        let d;
        if (fdr_version == 3) {
            let t = parseInt(line[0].trim());
            d = new Date(date.getFullYear(), date.getMonth(), date.getDate(), 0, 0, t);
        } else {
            let t = line[0].trim().split(":");
            let ms = Math.round(1000 * (t[2] - Math.round(t[2])))
            d = new Date(date.getFullYear(), date.getMonth(), date.getDate(), t[0], t[1], Math.round(t[2]), ms);
            d.setUTCHours(t[0]);
            // console.log("date", date, t, ms, d)
        }
        let props = {
            "UTC Time": d.toISOString(),
            "_raw_ts": d.getTime(),
            "elevation": line[2],
        }
        for(j=1; j < line.length; j++) {
            props[j < columns.length ? columns[j] : "prop" + j] = isNaN(line[j]) ? line[j] : parseFloat(line[j]);
        }
        let f = {
            id: count++,
            type: "Feature",
            geometry: {
                type: "Point",
                coordinates: [parseFloat(line[1]), parseFloat(line[2])]
            },
            properties: props
        }
        if (SHOW_ALTITUDE) {
            f.geometry.coordinates.push(parseFloat(line[3]));
        }
        fc.push(f);
        i++;
    }
    fc = fc.concat(navaids, commands);
    let geojson = {
        type: "FeatureCollection",
        features: fc
    }
    // console.log(geojson);
    // transpose data array:
    // output = array[0].map((_, colIndex) => array.map(row => row[colIndex]));
    RAW_FDR = true
    return geojson;
}

function clip(features) {
    const BEFORE_TO = 120.0; // seconds
    const AFTER_TD = 120.0; // seconds
    const ALT_MIN = 10.0;  // m
    const SPEED_MIN = 30.0;  // kt
    const ts = features.map((p) => p.properties._raw_ts * (RAW_FDR ? 1 : 1000)).sort();

    // save orignal id, you'll need it
    features.forEach( (f) => {
        f._id = f.id;
    });

    // find take off if any
    let alt = 0.0, spd = 0.0, i = 0, tt;
    while ((alt < ALT_MIN || spd < SPEED_MIN) && i < features.length) {
        alt = features[i].properties["agl"];
        spd = features[i].properties[SPEED_DATA];
        i++;
    }
    let start = 0;
    if (i < features.length) {
        // Go 2 minutes before
        let time = features[i].properties._raw_ts;
        tt = new Date(features[i].properties["UTC Time"])
        time -= BEFORE_TO * 1000;
        if (time > features[0].properties._raw_ts) {
            start = indexForValue(ts, time);
        }
    }
    console.log("clipping: take off", tt, alt, spd, i, start, features.length);

    // find landing if any, go backward, find takeoff
    i = features.length - 1;
    alt = 0.0;
    spd = 0.0;
    while ((alt < ALT_MIN && spd < SPEED_MIN) && i > -1) {
        alt = features[i].properties["agl"];
        spd = features[i].properties[SPEED_DATA];
        i--;
    }
    let end = features.length - 1;
    let was_before = false;
    if (i > 0) {
        // Go 2 minutes after
        let time = features[i].properties._raw_ts;
        tt = new Date(features[i].properties["UTC Time"])
        time += AFTER_TD * 1000;
        if (time < features[features.length - 1].properties._raw_ts) {
            end = indexForValue(ts, time);
            if (end < start) {
                end = features.length - 1;
                was_before = true;
            }
        }
    }
    console.log("clipping: landing", tt, alt, spd, i, end, was_before);

    newfeats = (start > 0 || end < features.length) ? features.slice(start, end) : features;
    console.log("clipping", start, end, newfeats.length, features.length);
    i = 0;
    newfeats.forEach( (f) => {
        f.id = i++;
    });
    return newfeats;
}

// MAP ZOOM MANAGEMENT
function placePoints(tmin, tmax) {
    let lo = timeIndex(tmin);
    let hi = timeIndex(tmax);
    let len = hi - lo;
    let step = len > MAX_MAP_POINTS ? Math.round(len / MAX_MAP_POINTS) : 1;

    flightpath.clearLayers();
    let i = 0;
    let cnt = 0;
    while (i < chartData[NUM_POINTS] && chartData[TIME_DATA][i] < tmin) {
        i++;
    }
    while (i < chartData[NUM_POINTS] && chartData[TIME_DATA][i] <= tmax) {
        flightpath.addLayer(chartData[POINTS][i]);
        cnt++;
        i += step;
    }
    console.log("map decimation", chartData[POINTS].length, MAX_MAP_POINTS, step, cnt);
}

function findMapZoomIndex() {
    // finds part of flight currently shown
    // finds first and last point on path that are display in map bounds
    const bbox = map.getBounds();
    let i = 0;
    while (i < chartData[LATLNGS].length && ! bbox.contains(chartData[LATLNGS][i])) {
        i++;
    }
    let lo = i;
    i = chartData[LATLNGS].length - 1;
    while (i >= 0 && ! bbox.contains(chartData[LATLNGS][i])) {
        i--;
    }
    if (lo > i) {
        const t = lo;
        lo = i;
        i = t;
    }
    // console.log("map: range shown", lo, i);
    return [lo, i];
}

function zoomMap() {
    // zoom map on visible part of flight
    map.fitBounds(chartData[LATLNGS].slice(zoomIndex[0], zoomIndex[1]));    
}

function mapZoomOnIndex(lo, hi) {
    // zoom map on supplied part of flight (called from charts, with range of visible part)
    if (lo > hi) {
        let t = lo;
        lo = hi;
        hi = t;
    }
    if (lo < 0 || lo > chartData[LATLNGS].length || hi < 0 || hi > chartData[LATLNGS].length) {
        console.warn("out of range", lo, hi)
        return;
    }
    zoomIndex = [lo, hi];
    zoomMap();
}

function mapZoomed() {
    // called when map zoom has changed
    zoomIndex = findMapZoomIndex();
    adjustCharts = (zoomIndex[1] - zoomIndex[0]) < (chartData[LATLNGS].length - 1);
    panOK = ! adjustCharts;
    if (allCharts[SPEED_ALT_CHART] != undefined) {
        syncAllCharts();
    }
    // console.log("map zoomed", adjustCharts)
}

function mapPanned() {
    // called when map is panned
    zoomIndex = findMapZoomIndex();
    if (allCharts[SPEED_ALT_CHART] != undefined && adjustCharts) {
        syncAllCharts();
    }
    // console.log("map panned", adjustCharts)
}

function optimizeChartLayout(numdata) {
    // Adjust NUM_DATA_PER_CHART, NUM_COLUMNS
    try {
        if (numdata > (MAX_LINES * NUM_COLUMNS * MAX_DATA_PER_CHART)) { // cannot restrict to MAX_LINES lines of graphs
            NUM_COLUMNS = MAX_COLUMNS;
            NUM_DATA_PER_CHART = MAX_DATA_PER_CHART;
            console.log("optimizeChartLayout maxima");
            return;
        }
        const limit = Math.min.apply(null, [MAX_COLUMNS, MAX_DATA_PER_CHART])
        console.log("optimizeChartLayout minimal", limit);
        if (numdata <= limit && COMPACT > 0) {
            if (COMPACT == 1) {
                NUM_DATA_PER_CHART = 1;
                NUM_COLUMNS = numdata;
            } else if (COMPACT == 2) {
                NUM_DATA_PER_CHART = numdata;
                NUM_COLUMNS = 1;
            }
            return;
        }
        if (numdata <= (MAX_LINES * NUM_COLUMNS)) { // max chart density but only 1 data per chart
            NUM_DATA_PER_CHART = 1;
            NUM_COLUMNS = Math.ceil(numdata / MAX_LINES);
            console.log("optimizeChartLayout 1 data per chart");
            return;
        }
        let per_line = Math.ceil(numdata / MAX_LINES);  // num of data to show per lines
        NUM_DATA_PER_CHART = Math.ceil(Math.sqrt(per_line));
        if (NUM_DATA_PER_CHART == 0) {
            NUM_DATA_PER_CHART = 1;
        }
        NUM_COLUMNS = Math.ceil(per_line / NUM_DATA_PER_CHART);
        let e_lines = Math.ceil(numdata / (NUM_DATA_PER_CHART * NUM_COLUMNS));
        // console.log("optimizeChartLayout", numdata, per_line, e_lines, MAX_LINES, NUM_COLUMNS, NUM_DATA_PER_CHART);
    } catch (e) { // restore defaults
        console.log(e);
        console.log("optimizeChartLayout default");
        NUM_COLUMNS = 3;          
        NUM_DATA_PER_CHART = 4;
    }
}

    const end = i - outof;
    console.log("decimation", lo, hi, len, outof, MAX_CHART_POINTS * outof, step, data.length, start, end);
    return data;

}

function indexForValue(arr, value) {
    // find index of value in *sorted* array arr
    // this only works if values are ordered,
    // solely used for time, which is ordered.
    let index = arr.indexOf(value);
    if (index > -1) { // found exact match
        return index;
    }
    index = 0;
    while (value > arr[index] && index < arr.length) {
        index++;
    }
    return index;
}

function timeIndex(ts) {
    // return original array index for supplied timestamp
    if (chartData[TIME_DATA] == undefined || chartData[TIME_DATA].length == 0) {
        console.error("no time array");
        return 0;
    }
    return indexForValue(chartData[TIME_DATA], ts);
}

    let ctx = document.getElementById("timelineChart");
    timelineChart = new Chart(ctx, config);
}

function installCharts() {
    let color = 0; // color

    // Named charts
    Object.keys(chartNames).forEach( (label) => { // for each named chart
        if (label == NO_CHART) {
            return;
        }
        let datasets = [];
        if (label == SPEED_ALT_CHART) {
            chartData[SPEED_DATA] = propertyValues(SPEED_DATA).map((s) => s * SPEED_CONVERT[SPEED_UNIT])
            datasets.push({
                backgroundColor: "rgba(" + SPEED_COLOR.join(",") + ", 0.2)",
                borderColor: "rgba(" + SPEED_COLOR.join(",") + ", 1)", // orange
                borderWidth: 2,
                data: fetchData(SPEED_DATA, -1, -1),
                label: SPEED_LABEL,
                yAxisID: "y",
            });
            chartData[ALTITUDE_DATA] = propertyValues(ALTITUDE_DATA).map((s) => s * ALTITUDE_CONVERT[ALTITUDE_UNIT])
            datasets.push({
                backgroundColor: "rgba(" + ALTITUDE_COLOR.join(",") + ", 0.2)",
                borderColor: "rgba(" + ALTITUDE_COLOR.join(",") + ", 1)", // blue
                borderWidth: 2,
                data: fetchData(ALTITUDE_DATA, -1, -1),
                label: ALTITUDE_LABEL,
                yAxisID: "y1",
            });
            addChart([label], datasets);
            addButtons();
            return;
        }
        const data_in_chart = chartNames[label].length
        // console.log("named chart", label, chartNames[label], chartNames[label].length)
        chartNames[label].forEach( (d) => {  // for each dataset/property in the named chart
            let data = propertyValues(d);  // builds chartData[d]
            datasets.push({
                backgroundColor: chartColor(color) + "60", // transparency
                borderColor: chartColor(color),
                borderWidth: 2,
                data: fetchData(d, -1, -1),
                label: d.replaceAll("_", " "),
                yAxisID: data_in_chart == 2 && (color%2) == 1 ? "y1" : "y",
            });
            color++;
        });
        addChart([label], datasets);
    });

    // All remaining charts
    let title = [];
    let datasets = [];
    let i = 0;
    while (i < anonCharts.length) {
        let label = anonCharts[i];
        let data = propertyValues(label);
        title.push(label.replaceAll("_", " "))
        datasets.push({
            backgroundColor: chartColor(i) + "60", // transparency
            borderColor: chartColor(i),
            borderWidth: 2,
            data: fetchData(label, -1, -1),
            label: label.replaceAll("_", " "),
            yAxisID: NUM_DATA_PER_CHART == 2 && (i%2) == 1 ? "y1" : "y",
        });
        if (datasets.length >= NUM_DATA_PER_CHART) {
            addChart(title, datasets);
            title = [];
            datasets = [];
        }
        color++;
        i++;
    }
    if (datasets.length > 0) {
        addChart(title, datasets);
    }
}

function addChart(title, datasets) {
    const chartId = (title.length > 0 && title[0] == SPEED_ALT_CHART) ? SPEED_ALT_CHART : "chart" + title.join("").replaceAll(" ", "");
    if (chartId != SPEED_ALT_CHART) {
        let chartContainerId = "charts"
        if (NUM_COLUMNS > 1) {
            chartContainerId += (Object.keys(allCharts).length % NUM_COLUMNS);
        }
        const frame = document.getElementById(chartContainerId);
        let canvas = document.createElement("canvas");
        canvas.id = chartId;
        frame.appendChild(canvas);
    }

    const zoomOptions = {
      zoom: {
        mode: "x",
        onZoomComplete: syncCharts,
        drag: {
          enabled: true,
          borderColor: "rgb(" + AIRCRAFT_COLOR + ")", // "rgb(54, 162, 235)"
          borderWidth: 1,
          backgroundColor: "rgba(" + AIRCRAFT_COLOR + ", 0.3)"
        }
      },
      pan: {
        enabled: true,
        mode: "x",
        onPanComplete: syncCharts,
        modifierKey: "shift",
      }
    };

    const config = {
        type: "line",
        plugins: [{ // https://stackoverflow.com/questions/68058199/chartjs-need-help-on-drawing-a-vertical-line-when-hovering-cursor
            afterDraw: chart => {
                if (chart.tooltip?._active?.length) {
                    let x = chart.tooltip._active[0].element.x;
                    let yAxis = chart.scales.y;
                    let ctx = chart.ctx;
                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(x, yAxis.top);
                    ctx.lineTo(x, yAxis.bottom);
                    ctx.lineWidth = 1;
                    ctx.strokeStyle = CHART_CURSOR_COLOR;
                    ctx.stroke();
                    ctx.restore();
                }
            }
        }],
        data: {
            datasets: datasets
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            normalized: true,
            onHover: (e) => {
                const canvasPosition = Chart.helpers.getRelativePosition(e, allCharts[chartId]);
                // get index for value
                const value = allCharts[chartId].scales.x.getValueForPixel(canvasPosition.x);
                const index = timeIndex(value);
                // console.log("other", chartId, canvasPosition, index);
                moveMapCursor(index);
            },
            scales: {
                x: {
                  type: "time",
                },
            },
            plugins: {
                zoom: zoomOptions,
                legend: {
                    position: "top",
                },
                title: {
                    display: chartId != SPEED_ALT_CHART,
                    text: title.join(", ")
                }
            },
            interaction: {
                intersect: false,
                mode: "index",
            }
        },
    };
    // raffinement for special cases
    if (chartId == SPEED_ALT_CHART) {
        config.options.plugins["tooltip"] = {
            callbacks: {
                label: function(context) {
                    let label = context.dataset.label || "";
                    if (label) {
                        label += ": ";
                    }
                    if (context.parsed.y !== null) {
                        if (context.dataset.label == SPEED_LABEL) {
                            label += Math.round(context.parsed.y, 0) + SPEED_UNIT;
                        } else if (context.dataset.label == ALTITUDE_LABEL) {
                            label += Math.round(context.parsed.y, 0) + ALTITUDE_UNIT;
                        }
                    }
                    return label;
                }
            }
        }
    }
    if (datasets.length == 2) {
        if (config["data"]["datasets"][1]["yAxisID"] == "y") { // forces second scale
            config["data"]["datasets"][1]["yAxisID"] = "y1"
        }        
        let before = config["options"]["scales"] ? config["options"]["scales"] : {}
        config["options"]["scales"] = Object.assign({}, before, {
                y: {
                    type: "linear",
                    display: true,
                    position: "left",
                    title: {
                        display: true,
                        text: datasets[0]["label"],
                        color: datasets[0]["borderColor"],

                            top: 30,

                            right: 0,
                            bottom: 0

                y1: {
                    type: "linear",

                    position: "right",
                    title: {
                        display: true,
                        text: datasets[1]["label"],

                        padding: {
                            top: 30,

                            right: 0,
                            bottom: 0
                        }
                    },
                    // grid line settings
                    grid: {
                        drawOnChartArea: false, // only want the grid lines for one axis to show up
                    },
                },
            }
        );
    }

    const ctx = document.getElementById(chartId);
    allCharts[chartId] = new Chart(ctx, config);
}

// CHART ZOOM MANAGEMENT
// See here: https://github.com/chartjs/chartjs-plugin-zoom/issues/238
function syncCharts(chart) {
    // called when a chart is zoomed or panned to update all other charts
    const sourceChart = chart.chart;

    if (typeof sourceChart.initial === 'undefined') {
        sourceChart.initial = sourceChart.getInitialScaleBounds();
    }

    const sourceInitialBounds = sourceChart.initial;

    const sourceXrange = Math.abs(sourceInitialBounds.x.max) + Math.abs(sourceInitialBounds.x.min);
    const sourceXscaleMin = (sourceChart.scales.x.min - sourceInitialBounds.x.min) / sourceXrange;
    const sourceXscaleMax = (sourceChart.scales.x.max - sourceInitialBounds.x.max) / sourceXrange;

    const sourceYrange = Math.abs(sourceInitialBounds.y.max) + Math.abs(sourceInitialBounds.y.min);
    const sourceYscaleMin = (sourceChart.scales.y.min - sourceInitialBounds.y.min) / sourceYrange;
    const sourceYscaleMax = (sourceChart.scales.y.max - sourceInitialBounds.y.max) / sourceYrange;

    Object.values(Chart.instances).forEach(targetChart => {
        if (targetChart !== chart.chart) {
            if (typeof targetChart.initial === 'undefined') {
                targetChart.initial = targetChart.getInitialScaleBounds();
            }

            const targetInitialBounds = targetChart.initial;

            const targetXrange = Math.abs(targetInitialBounds.x.max) + Math.abs(targetInitialBounds.x.min);
            targetChart.options.scales.x.min = targetInitialBounds.x.min + targetXrange * sourceXscaleMin;
            targetChart.options.scales.x.max = targetInitialBounds.x.max + targetXrange * sourceXscaleMax;

            const targetYrange = Math.abs(targetInitialBounds.y.max) + Math.abs(targetInitialBounds.y.min);
            targetChart.options.scales.y.min = targetInitialBounds.y.min + targetYrange * sourceYscaleMin;
            targetChart.options.scales.y.max = targetInitialBounds.y.max + targetYrange * sourceYscaleMax;

            targetChart.update();
        }
    });
    // Synchronize map
    let lo = timeIndex(sourceChart.scales.x.min);
    let hi = timeIndex(sourceChart.scales.x.max);
    // console.log("chart: range shown", lo, hi);
    mapZoomOnIndex(lo, hi);
    panOK = false;  // since we focus on part of flight
}

function syncAllCharts() {
    // called when a chart is zoomed or panned
    // could not get chart.zoom() and chart.pan() working.
    // worked around like so:
    const sourceChart = allCharts[SPEED_ALT_CHART]; // we need on to start, they're all synchronized
    if (typeof sourceChart.initial === 'undefined') {
        sourceChart.initial = sourceChart.getInitialScaleBounds();
    }
    // compute new scale values on speedAltChart (model, all charts share similar x axis)
    const sourceInitialBounds = sourceChart.initial;
    const new_min = chartData[TIME_DATA][zoomIndex[0]];
    const new_max = chartData[TIME_DATA][zoomIndex[1]];
    const sourceXrange = Math.abs(sourceInitialBounds.x.max) + Math.abs(sourceInitialBounds.x.min);
    const sourceXscaleMin = (new_min - sourceInitialBounds.x.min) / sourceXrange;
    const sourceXscaleMax = (new_max - sourceInitialBounds.x.max) / sourceXrange;
    const sourceYrange = Math.abs(sourceInitialBounds.y.max) + Math.abs(sourceInitialBounds.y.min);
    const sourceYscaleMin = (sourceChart.scales.y.min - sourceInitialBounds.y.min) / sourceYrange;
    const sourceYscaleMax = (sourceChart.scales.y.max - sourceInitialBounds.y.max) / sourceYrange;
    // update all charts (including speedAltChart) with new scale values
    Object.values(Chart.instances).forEach(targetChart => {
        if (typeof targetChart.initial === 'undefined') {
            targetChart.initial = targetChart.getInitialScaleBounds();
        }
        const targetInitialBounds = targetChart.initial;
        const targetXrange = Math.abs(targetInitialBounds.x.max) + Math.abs(targetInitialBounds.x.min);
        targetChart.options.scales.x.min = targetInitialBounds.x.min + targetXrange * sourceXscaleMin;
        targetChart.options.scales.x.max = targetInitialBounds.x.max + targetXrange * sourceXscaleMax;
        const targetYrange = Math.abs(targetInitialBounds.y.max) + Math.abs(targetInitialBounds.y.min);
        targetChart.options.scales.y.min = targetInitialBounds.y.min + targetYrange * sourceYscaleMin;
        targetChart.options.scales.y.max = targetInitialBounds.y.max + targetYrange * sourceYscaleMax;
        targetChart.update();
    });
    panOK = false;  // since we focus on part of flight
}

// CURSOR ANIMATION
function convertDegreesToRadians(degrees) {
    return degrees * (Math.PI / 180);
}

function convertRadiansToDegrees(radians) {
    return radians * (180 / Math.PI);
}

function aircraftPosition(idx) {
    if (idx == undefined) {
        console.warn("aircraftPosition", idx);
        return;
    }
    let pos = chartData[LATLNGS][idx];
    let orient = orients[idx];
    return pos + orients;
}

function distance(src, dst) {
    if (src == undefined || dst == undefined) {
        console.warn("distance", src, dst);
        return 0.0;
    }
    let lat1 = convertDegreesToRadians(src[0]);
    let lon1 = convertDegreesToRadians(src[1]);
    let lat2 = convertDegreesToRadians(dst[0]);
    let lon2 = convertDegreesToRadians(dst[1]);
    
    const { sin, cos, sqrt, atan2 } = Math;
    
    const R = 6371; // earth radius in km 
    const dLat = lat2 - lat1;
    const dLon = lon2 - lon1;
    const a = sin(dLat / 2) * sin(dLat / 2)
            + cos(lat1) * cos(lat2)
            * sin(dLon / 2) * sin(dLon / 2);
    const c = 2 * atan2(sqrt(a), sqrt(1 - a)); 
    const d = R * c;
    return d; // distance in km
}

function tracking(src, dst) {
    if (src == undefined || dst == undefined) {
        console.warn("tracking", src, dst);
        return 0.0;
    }
    let lat1 = convertDegreesToRadians(src[0]);
    let lon1 = convertDegreesToRadians(src[1]);
    let lat2 = convertDegreesToRadians(dst[0]);
    let lon2 = convertDegreesToRadians(dst[1]);
    let y = Math.sin(lon2 - lon1) * Math.cos(lat2);
    let x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(lon2 - lon1);
    return convertRadiansToDegrees(Math.atan2(y, x));
}

function trackingAtIndex(idx_in) {
    if (idx_in == undefined) {
        console.warn("trackingAtIndex", idx_in);
        return 0.0;
    }
    let idx = idx_in >= chartData[LATLNGS].length ? chartData[LATLNGS].length - 1 : idx_in;
    let rot = idx >= (chartData[LATLNGS].length - 1) ?
        tracking(chartData[LATLNGS][chartData[LATLNGS].length - 2], chartData[LATLNGS][chartData[LATLNGS].length - 1]) :
        tracking(chartData[LATLNGS][idx], chartData[LATLNGS][idx+1]);
    return rot;
}

function moveMapCursor(idx_in) {
    if (idx_in == undefined) {
        console.warn("moveMapCursor", idx_in);
        return;
    }
    let idx = idx_in >= chartData[LATLNGS].length ? chartData[LATLNGS].length - 1 : idx_in;
    let rot = trackingAtIndex(idx) + AIRCRAFT_ICON_ROTATION;
    mapCursor.setLatLng(chartData[LATLNGS][idx]);
    mapCursor._icon.style.transformOrigin = Math.round(AIRCRAFT_ICON_SIZE/2) + "px " +
                                            Math.round(AIRCRAFT_ICON_SIZE/2) + "px";
    mapCursor._icon.style.transform += " rotateZ(" + Math.round(rot) + "deg)";
    // console.log(mapCursor._icon.style.transform);
    if (panOK) {
        map.panTo(chartData[LATLNGS][idx]);
    }
}

    let yAxis = allCharts[SPEED_ALT_CHART].scales.y;

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x, yAxis.top);
    ctx.lineTo(x, yAxis.bottom);
    ctx.lineWidth = 1;
    ctx.strokeStyle = CHART_CURSOR_COLOR;
    ctx.stroke();
    ctx.restore();
    Object.values(allCharts).forEach( (chart) => {
        let x = chart.scales.x.getPixelForValue(chartData[TIME_DATA][idx], idx);
        let yAxis = chart.scales.y;
        let ctx = chart.ctx;

        //     ctx.putImageData(chartImages[chart], 0, 0);
        // }
        // chartImages[chart] = ctx.getImageData(0,0,chart.canvas.width,chart.canvas.height);
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(x, yAxis.top);
        ctx.lineTo(x, yAxis.bottom);
        ctx.lineWidth = 1;
        ctx.strokeStyle = CHART_CURSOR_COLOR;
        ctx.stroke();
        ctx.restore();
        setTimeout(function () {
            // return the canvas to the state right after we drew the blue rect
            ctx.putImageData(id2, 0, 0);
        }, 100);
    })
}

// MAIN
function build(text, filetype) {
    document.body.style["background-image"] = "none";
    let geojson;
    if (filetype == "text/csv") {
        geojson = parseCSVFile(text);
    } else if (filetype == "") {
        geojson = parseFDRFile(text);
    } else {
        geojson = parseGeoJSONFile(text);
    }
    buildMap(geojson);
    buildCharts();
    // makeFetchChart(); // temporary
}

document.documentElement.addEventListener("dragover", (e) => {
    e.preventDefault();
    document.body.classList.add("dragging");
});

document.documentElement.addEventListener("dragleave", () => {
    document.body.classList.remove("dragging");
});

document.documentElement.addEventListener("drop", (e) => {
    e.preventDefault();
    document.body.classList.remove("dragging");
    let fr = new FileReader();
    let ft = e.dataTransfer.files[0].type;
    fr.onload = function() {
        build(fr.result, ft);
    };
    if (ALLOWED_FILE_TYPES.indexOf(e.dataTransfer.files[0].type) > -1) {
        console.log("file FDR viewer", VERSION);        
        console.log("file type", e.dataTransfer.files[0].type);
        fr.readAsText(e.dataTransfer.files[0]);
    } else {
        console.log("invalid file type", e.dataTransfer.files[0].type);
    }
});
